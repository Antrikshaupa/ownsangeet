server {
    listen 80;
    server_name ownsangeet.com www.ownsangeet.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ownsangeet.com www.ownsangeet.com;

    ssl_certificate /etc/letsencrypt/live/ownsangeet.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ownsangeet.com-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # React Router client assets - serve directly from build folder
    location /assets/ {
        alias /var/www/ownsangeet/client/build/client/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API routes - proxy to backend (port 5001)
    location /api {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Audio files
    location /audios/ {
        alias /var/www/ownsangeet/client/public/audios/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Photo files  
    location /photos/ {
        alias /var/www/ownsangeet/client/public/photos/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Frontend SSR - proxy to React Router server (port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
