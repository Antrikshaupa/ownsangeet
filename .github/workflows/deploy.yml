name: Deploy OwnSangeet

on:
  push:
    branches: [main, v2-security-update]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            cd /var/www/ownsangeet
            git fetch --all
            git reset --hard origin/${{ github.ref_name }}
            
            # Build server
            cd server
            npm install --include=dev
            npm run build
            
            # Build client
            cd ../client
            npm install --include=dev
            npm run build
            
            # Restart PM2 processes (zero-downtime)
            pm2 restart ownsangeet-backend ownsangeet-frontend
            
            # Health check
            sleep 5
            curl -f http://localhost:5001/api/v1/health || echo "Health endpoint not available, but deployment continued"
            
            echo "✅ Deployment complete!"

      - name: Deployment Status
        if: always()
        run: echo "Deployment finished with status ${{ job.status }}"
